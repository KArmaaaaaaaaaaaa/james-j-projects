<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSISTEMA // Estación JB-01</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #0a0a0f;
            --deep: #12121a;
            --surface: #1a1a2e;
            --surface-light: #252540;
            --neon-green: #00ff88;
            --neon-green-glow: rgba(0,255,136,0.3);
            --neon-purple: #a855f7;
            --neon-purple-glow: rgba(168,85,247,0.3);
            --neon-blue: #00aaff;
            --neon-red: #ff4444;
            --warm: #F0B889;
            --ink: #ffffff;
            --ink-muted: rgba(255,255,255,0.6);
            --line: rgba(255,255,255,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--void);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Scanlines */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
            pointer-events: none;
            z-index: 9999;
        }

        /* HUD Top */
        .hud-top {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            padding: 12px 24px;
            background: rgba(10,10,15,0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-top .logo {
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            color: var(--neon-green);
        }

        .hud-top .stats {
            display: flex;
            gap: 24px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }

        .stat .icon {
            width: 8px; height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .stat .icon.green { background: var(--neon-green); }
        .stat .icon.purple { background: var(--neon-purple); }
        .stat .icon.blue { background: var(--neon-blue); }

        .stat .value { color: var(--neon-green); }

        .hud-top .time {
            font-size: 11px;
            color: var(--ink-muted);
        }

        /* Main layout */
        .station-container {
            display: flex;
            margin-top: 50px;
            min-height: calc(100vh - 50px);
        }

        /* Sidebar - Crew */
        .sidebar {
            width: 260px;
            background: var(--deep);
            border-right: 1px solid var(--line);
            padding: 24px 16px;
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--ink-subtle);
            margin-bottom: 20px;
        }

        .crew-member {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            background: var(--surface);
            border: 1px solid var(--line);
            transition: all 0.3s;
            cursor: pointer;
        }

        .crew-member:hover {
            border-color: var(--neon-green);
            transform: translateX(4px);
        }

        .crew-member .avatar {
            width: 32px; height: 32px;
            border-radius: 4px;
            background: var(--surface-light);
            border: 1px solid var(--line);
            /* Sin esto el navegador suaviza al escalar y el píxel se
               convierte en una mancha. Es la línea que hace que se vea
               pixelado de verdad. */
            image-rendering: pixelated;
        }

        .crew-member .info { flex: 1; }

        .crew-member .name {
            font-size: 12px;
            font-weight: 700;
        }

        .crew-member .status {
            font-size: 10px;
            color: var(--ink-muted);
        }

        .crew-member .status.working { color: var(--neon-green); }
        .crew-member .status.idle { color: var(--warm); }

        /* Station Map */
        .station-map {
            flex: 1;
            padding: 32px;
            overflow: auto;
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 180px);
            gap: 8px;
            min-width: 800px;
        }

        .room {
            background: var(--surface);
            border: 2px solid var(--line);
            border-radius: 4px;
            padding: 16px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
        }

        .room::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(0,255,136,0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        .room:hover {
            border-color: var(--neon-green);
            transform: scale(1.02);
            box-shadow: 0 0 30px var(--neon-green-glow);
        }

        .room.active {
            border-color: var(--neon-green);
            background: var(--surface-light);
        }

        .room .room-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .room .room-name {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .room .room-desc {
            font-size: 10px;
            color: var(--ink-muted);
        }

        .room .room-agents {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: flex;
            gap: 4px;
        }

        .room .agent-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--neon-green);
            animation: pulse 2s infinite;
        }

        .room .agent-dot.idle { background: var(--warm); }

        /* Corridor connections */
        .corridor {
            background: transparent;
            border: 1px dashed var(--line);
        }

        /* Detail panel */
        .detail-panel {
            position: fixed;
            bottom: 0; left: 260px; right: 0;
            background: var(--deep);
            border-top: 1px solid var(--line);
            padding: 20px 32px;
            transform: translateY(100%);
            transition: transform 0.4s;
            z-index: 50;
        }

        .detail-panel.open { transform: translateY(0); }

        .detail-panel h4 {
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--neon-green);
        }

        .detail-panel p {
            font-size: 12px;
            color: var(--ink-muted);
        }

        /* Alerts */
        .alerts {
            position: fixed;
            top: 60px;
            right: 20px;
            z-index: 90;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .alert {
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--neon-green);
            border-radius: 4px;
            font-size: 11px;
            animation: slideIn 0.5s, fadeOut 0.5s 3s forwards;
            max-width: 280px;
        }

        .alert.warning { border-color: var(--warm); }

        /* Particles */
        .particles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px; height: 2px;
            background: var(--neon-green);
            border-radius: 50%;
            opacity: 0.4;
            animation: float linear infinite;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-100px) translateX(50px); opacity: 0; }
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateX(50px); }
        }

        @keyframes walk {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar { width: 200px; }
            .detail-panel { left: 200px; }
            .map-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .detail-panel { left: 0; }
            .map-grid { grid-template-columns: repeat(2, 1fr); min-width: auto; }
            .hud-top .stats { display: none; }
        }
    </style>
</head>
<body>
    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- HUD Top -->
    <div class="hud-top">
        <div class="logo">JB-01 STATION</div>
        <div class="stats">
            <div class="stat">
                <span class="icon green"></span>
                <span>Tripulación:</span>
                <span class="value" id="crew-count">7</span>
            </div>
            <div class="stat">
                <span class="icon purple"></span>
                <span>Energía:</span>
                <span class="value" id="energy">94%</span>
            </div>
            <div class="stat">
                <span class="icon blue"></span>
                <span>Alertas:</span>
                <span class="value" id="alerts-count">0</span>
            </div>
        </div>
        <div class="time" id="station-time">--:--:--</div>
    </div>

    <!-- Main -->
    <div class="station-container">
        <!-- Sidebar - Crew -->
        <aside class="sidebar">
            <h3>// TRIPULACIÓN</h3>
            <div id="crew-list"></div>
        </aside>

        <!-- Station Map -->
        <main class="station-map">
            <div class="map-grid" id="map-grid"></div>
        </main>
    </div>

    <!-- Detail Panel -->
    <div class="detail-panel" id="detail-panel">
        <h4 id="detail-title">Módulo</h4>
        <p id="detail-desc">Selecciona un módulo para ver detalles.</p>
    </div>

    <!-- Alerts -->
    <div class="alerts" id="alerts"></div>

    <script>
        // Station Data
        const rooms = [
            { id: 'bridge', name: 'Puente de Mando', icon: '🎛️', desc: 'Centro de control principal', row: 1, col: 2, agents: ['ULTRON'] },
            { id: 'lab', name: 'Laboratorio', icon: '🔬', desc: 'Investigación y desarrollo', row: 1, col: 1, agents: ['NOVA', 'PIXEL'] },
            { id: 'engine', name: 'Sala de Máquinas', icon: '⚡', desc: 'Reactor y propulsión', row: 2, col: 1, agents: ['FORGE'] },
            { id: 'medbay', name: 'Enfermería', icon: '🏥', desc: 'Sistema médico avanzado', row: 2, col: 2, agents: ['STUART'] },
            { id: 'comms', name: 'Comunicaciones', icon: '📡', desc: 'Enlace con estaciones externas', row: 3, col: 1, agents: ['CYPHER'] },
            { id: 'storage', name: 'Almacén', icon: '📦', desc: 'Recursos y suministros', row: 3, col: 2, agents: [] },
            { id: 'quarters', name: 'Quarteles', icon: '🛏️', desc: 'Área de descanso crew', row: 1, col: 3, agents: [] },
            { id: 'hangar', name: 'Hangar', icon: '🚀', desc: 'Docking y mantenimiento naves', row: 2, col: 3, agents: ['OPTIMUS'] },
            { id: 'garden', name: 'Invernadero', icon: '🌱', desc: 'Producción de oxígeno y comida', row: 3, col: 3, agents: [] },
        ];

        const crew = [
            { name: 'ULTRON', role: 'Comandante', status: 'working', room: 'bridge', avatar: '🤖' },
            { name: 'NOVA', role: 'Científica', status: 'working', room: 'lab', avatar: '👩‍🔬' },
            { name: 'PIXEL', role: 'Ingeniera', status: 'working', room: 'lab', avatar: '👨‍💻' },
            { name: 'OPTIMUS', role: 'Piloto', status: 'working', room: 'hangar', avatar: '🧑‍🚀' },
            { name: 'FORGE', role: 'Mecánico', status: 'idle', room: 'engine', avatar: '🔧' },
            { name: 'STUART', role: 'Médico', status: 'idle', room: 'medbay', avatar: '👨‍⚕️' },
            { name: 'CYPHER', role: 'Comunicaciones', status: 'idle', room: 'comms', avatar: '📻' },
        ];

        /* ─── Avatares de píxeles, dibujados aquí mismo ────────────────────
         *
         * Cada tripulante se dibuja en una rejilla de 16x16 a partir de SU
         * NOMBRE: el mismo nombre da siempre el mismo personaje, y nombres
         * distintos dan cascos, visores y colores distintos. No hay ni un
         * fichero de imagen, ni un sprite descargado, ni una llamada a un
         * generador de terceros. El pie de tu web promete «sin plantilla y
         * sin nada de terceros»; esto lo cumple.
         *
         * Lo que lo hace hipnótico no es el dibujo, es el DESFASE: cada uno
         * respira, parpadea y escanea a su ritmo, arrancando en un punto
         * distinto del ciclo. Si van a la vez parece un cartel de neón; si
         * van desacompasados parece que están vivos.
         */
        function semilla(txt) {
            let h = 2166136261;
            for (let i = 0; i < txt.length; i++) {
                h ^= txt.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return h >>> 0;
        }

        function paleta(s) {
            // Tono del traje repartido por el círculo cromático, pero siempre
            // oscuro y saturado: sobre fondo negro, los pasteles desaparecen.
            const tono = s % 360;
            return {
                traje:  `hsl(${tono} 55% 42%)`,
                sombra: `hsl(${tono} 60% 26%)`,
                brillo: `hsl(${tono} 45% 62%)`,
                visor:  `hsl(${(tono + 165) % 360} 85% 58%)`,
            };
        }

        // t = fotograma global. activo = si el agente está trabajando.
        function pintar(ctx, s, t, activo) {
            const p = paleta(s);
            const P = 2;                       // cada píxel lógico son 2 reales
            const px = (x, y, w, h, c) => {
                ctx.fillStyle = c;
                ctx.fillRect(x * P, y * P, w * P, h * P);
            };
            ctx.clearRect(0, 0, 32, 32);

            // Respirar: 1 px arriba y abajo. Los que trabajan, más rápido.
            const ritmo = activo ? 14 : 26;
            const fase  = (t + (s % ritmo)) % ritmo;
            const dy    = fase < ritmo / 2 ? 0 : 1;

            // Antena: tres variantes según la semilla, para que no sean clones
            const antena = s % 3;
            if (antena === 0) px(7, 1 + dy, 2, 2, p.brillo);
            if (antena === 1) { px(4, 2 + dy, 1, 2, p.brillo); px(11, 2 + dy, 1, 2, p.brillo); }
            if (antena === 2) px(7, 0 + dy, 2, 3, p.sombra);

            px(4, 3 + dy, 8, 6, p.traje);      // casco
            px(4, 3 + dy, 8, 1, p.brillo);     // luz dura arriba, sin degradado
            px(3, 5 + dy, 1, 3, p.sombra);     // orejeras
            px(12, 5 + dy, 1, 3, p.sombra);

            // Visor. Al parpadear se apaga dos fotogramas: es lo que da la
            // sensación de que hay alguien dentro.
            const parpadeo = ((t + s) % 190) < 3;
            px(5, 5 + dy, 6, 3, parpadeo ? p.sombra : '#05070c');
            if (!parpadeo) {
                // Línea de barrido dentro del visor
                const bx = 5 + (Math.floor((t + s) / (activo ? 5 : 11)) % 6);
                px(bx, 5 + dy, 1, 3, p.visor);
            }

            px(5, 9 + dy, 6, 4, p.traje);      // torso
            px(4, 10 + dy, 1, 3, p.sombra);    // brazos
            px(11, 10 + dy, 1, 3, p.sombra);
            px(5, 9 + dy, 6, 1, p.brillo);     // filo del hombro
            px(7, 11 + dy, 2, 1, p.visor);     // distintivo del pecho
            // Las piernas van en la fila 13: con el balanceo la 14 se salía
            // del lienzo y quedaban cortadas por abajo.
            px(5, 13 + dy, 2, 2, p.sombra);
            px(9, 13 + dy, 2, 2, p.sombra);
        }

        const lienzos = [];
        let reloj = 0, animando = true;

        function latido() {
            if (!animando) return;
            reloj++;
            for (const l of lienzos) pintar(l.ctx, l.s, reloj, l.activo);
            // 12 fotogramas por segundo: el paso corto es parte del lenguaje
            // del píxel, y además no calienta el portátil.
            setTimeout(() => requestAnimationFrame(latido), 1000 / 12);
        }

        // Si la pestaña no se ve, no se pinta. Un fondo animado que sigue
        // corriendo escondido es batería tirada.
        document.addEventListener('visibilitychange', () => {
            animando = !document.hidden;
            if (animando) latido();
        });

        // Render rooms
        const mapGrid = document.getElementById('map-grid');
        rooms.forEach(room => {
            const roomEl = document.createElement('div');
            roomEl.className = 'room';
            roomEl.dataset.id = room.id;
            roomEl.style.gridRow = room.row;
            roomEl.style.gridColumn = room.col;
            roomEl.innerHTML = `
                <div class="room-icon">${room.icon}</div>
                <div class="room-name">${room.name}</div>
                <div class="room-desc">${room.desc}</div>
                <div class="room-agents">${room.agents.map(n =>
                    `<canvas class="agente" width="32" height="32" data-n="${n}"
                             role="img" aria-label="${n}"></canvas>`).join('')}</div>
            `;
            roomEl.addEventListener('click', () => showDetail(room));
            mapGrid.appendChild(roomEl);
            // Los mismos tripulantes, dentro de su sala. Un punto verde no
            // dice quién está ahí; el personaje sí, y además se mueve.
            roomEl.querySelectorAll('canvas.agente').forEach(cv => {
                const n = cv.dataset.n;
                const quien = crew.find(m => m.name === n);
                lienzos.push({
                    ctx: cv.getContext('2d'),
                    s: semilla(n),
                    activo: quien ? quien.status === 'working' : true,
                });
            });
        });

        // Render crew
        const crewList = document.getElementById('crew-list');
        crew.forEach(member => {
            const memberEl = document.createElement('div');
            memberEl.className = 'crew-member';
            memberEl.innerHTML = `
                <canvas class="avatar" width="32" height="32" role="img"
                        aria-label="Avatar de ${member.name}"></canvas>
                <div class="info">
                    <div class="name">${member.name}</div>
                    <div class="status ${member.status}">${member.status === 'working' ? '● Trabajando' : '○ En espera'}</div>
                </div>
            `;
            crewList.appendChild(memberEl);
            const cv = memberEl.querySelector('canvas.avatar');
            lienzos.push({
                ctx: cv.getContext('2d'),
                s: semilla(member.name),
                activo: member.status === 'working',
            });
        });
        latido();

        // Show room detail
        function showDetail(room) {
            document.querySelectorAll('.room').forEach(r => r.classList.remove('active'));
            document.querySelector(`[data-id="${room.id}"]`).classList.add('active');
            document.getElementById('detail-title').textContent = `${room.icon} ${room.name}`;
            document.getElementById('detail-desc').textContent = room.desc + ` — Agentes: ${room.agents.length > 0 ? room.agents.join(', ') : 'Sin asignar'}`;
            document.getElementById('detail-panel').classList.add('open');
        }

        // Station clock
        function updateClock() {
            const now = new Date();
            document.getElementById('station-time').textContent =
                now.toTimeString().split(' ')[0] + ' UTC';
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (8 + Math.random() * 12) + 's';
            particle.style.animationDelay = Math.random() * 10 + 's';
            particle.style.width = (1 + Math.random() * 2) + 'px';
            particle.style.height = particle.style.width;
            particlesContainer.appendChild(particle);
        }

        // Random alerts
        const alertMessages = [
            'Sistema nominal',
            'Escaneo completado',
            'Recursos estables',
            'Sin incidencias',
            'Comunicación estable',
            'Reactor al 94%',
        ];

        function showAlert() {
            const alertsContainer = document.getElementById('alerts');
            const alert = document.createElement('div');
            alert.className = 'alert';
            alert.textContent = alertMessages[Math.floor(Math.random() * alertMessages.length)];
            alertsContainer.appendChild(alert);
            setTimeout(() => alert.remove(), 4000);
        }

        setInterval(showAlert, 5000 + Math.random() * 5000);
        setTimeout(showAlert, 2000);

        // Agent movement simulation
        function moveAgent() {
            const members = document.querySelectorAll('.crew-member');
            const randomMember = members[Math.floor(Math.random() * members.length)];
            randomMember.style.transform = 'translateX(8px)';
            setTimeout(() => randomMember.style.transform = '', 500);
        }

        setInterval(moveAgent, 3000);

        // Energy fluctuation
        function fluctuateEnergy() {
            const energy = document.getElementById('energy');
            const value = 90 + Math.floor(Math.random() * 8);
            energy.textContent = value + '%';
        }
        setInterval(fluctuateEnergy, 4000);

        console.log('%c JB-01 STATION ONLINE ', 'background: #00ff88; color: #000; padding: 4px 8px; font-weight: bold;');
        console.log('%c Ecosistema inicializado correctamente ', 'color: #00ff88;');
    </script>
</body>
</html>
